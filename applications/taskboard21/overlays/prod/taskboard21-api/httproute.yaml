apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: taskboard21-api
  labels:
    app: taskboard21-api
    app.kubernetes.io/name: taskboard21-api
    app.kubernetes.io/part-of: taskboard21
    app.kubernetes.io/managed-by: gitops-app
spec:
  parentRefs:
  - name: traefik-gateway
    namespace: kube-system
  hostnames:
  - taskboard21-api.taskboard21-prod.localhost
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: taskboard21-api
      port: 80
